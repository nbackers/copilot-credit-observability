name: Endpoint change
description: An endpoint has moved, changed shape, or started failing
labels: [endpoint-change]
body:
  - type: markdown
    attributes:
      value: |
        These are undocumented endpoints and can change without notice.
        See `docs/devtools-capture.md` for how to recapture them.

        **Redact your tenant ID, environment IDs and any bearer token.**

  - type: dropdown
    id: which
    attributes:
      label: Which call is affected?
      options:
        - "Environment capacity (v2.0 .../environments/entitlementConsumptions/{type})"
        - "Resource consumption (v2.0 .../entitlements/{type}/resources)"
        - "Downloads report (v1.0 .../Downloads/getAll/...)"
        - "Token acquisition / audience"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - "404 Not Found — path moved"
        - "401 Unauthorized — audience changed"
        - "403 Forbidden — role requirement changed"
        - "200 but the response shape changed"
        - "Other"
    validations:
      required: true

  - type: input
    id: old-path
    attributes:
      label: Path that used to work
      placeholder: /v2.0/tenants/{tenantId}/environments/entitlementConsumptions/MCSMessages

  - type: input
    id: new-path
    attributes:
      label: New path captured from DevTools (if found)

  - type: input
    id: audience
    attributes:
      label: Token audience (`aud` claim from jwt.ms)
      placeholder: https://licensing.powerplatform.microsoft.com

  - type: textarea
    id: response
    attributes:
      label: Redacted response fragment
      render: json

  - type: input
    id: date
    attributes:
      label: Date observed
      placeholder: 2026-08-18
